name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Сборка
        run: gradle --no-daemon assembleRelease

      - name: Подготовить APK
        run: cp app/build/outputs/apk/release/app-release.apk Snow.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Snow-apk
          path: Snow.apk

      - name: Выложить в релиз latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Снег — последняя сборка" --notes "APK приложения Снег"
          gh release upload latest Snow.apk --clobber
